<!DOCTYPE html>
<html lang="es" class="h-full bg-theme-bg text-theme-main">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d0205">
    <meta name="description" content="Reproductor y descargador de música offline PWA">
    
    <title>SoundFlow - Downloader & Player</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            bg: '#0d0205',
                            card: 'rgba(35, 8, 15, 0.55)',
                            border: 'rgba(225, 29, 72, 0.2)',
                            primary: '#e11d48',
                            hover: '#f43f5e',
                            wine: '#800020',
                            dark: '#2b0008',
                            main: '#fff1f2',
                            muted: '#fda4af',
                            glow: 'rgba(225, 29, 72, 0.35)'
                        }
                    },
                    transitionTimingFunction: {
                        'spring': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
                        'smooth': 'cubic-bezier(0.16, 1, 0.3, 1)',
                    },
                    boxShadow: {
                        'rose-glow': '0 0 25px -5px rgba(225, 29, 72, 0.35)',
                        'rose-sm': '0 0 10px -2px rgba(225, 29, 72, 0.25)'
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS Variables & CSS -->
    <style>
        :root {
            --bg-color: #0d0205;
            --card-bg: rgba(35, 8, 15, 0.55);
            --card-border: rgba(225, 29, 72, 0.2);
            --primary: #e11d48;
            --primary-hover: #f43f5e;
            --accent-wine: #800020;
            --accent-dark: #2b0008;
            --text-main: #fff1f2;
            --text-muted: #fda4af;
            --glow-pink: rgba(225, 29, 72, 0.35);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0205;
        }
        ::-webkit-scrollbar-thumb {
            background: #800020;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #e11d48;
        }
    </style>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/components.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-theme-primary selection:text-white select-none bg-theme-bg text-theme-main">

    <!-- Header / Navbar Top -->
    <header class="h-16 border-b border-theme-border bg-theme-bg/80 backdrop-blur-lg px-4 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-theme-wine to-theme-primary flex items-center justify-center text-white font-bold shadow-rose-glow">
                <i data-lucide="music" class="w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-theme-main via-theme-muted to-theme-primary bg-clip-text text-transparent">
                SoundFlow
            </h1>
        </div>

        <!-- Connection / PWA status -->
        <div class="flex items-center gap-2">
            <button id="btn-sync" title="Resincronizar biblioteca" class="p-2 text-theme-muted hover:text-white hover:bg-theme-wine/40 transition-all rounded-lg">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
            <button id="btn-share" title="Compartir App" class="p-2 text-theme-muted hover:text-white hover:bg-theme-wine/40 transition-all rounded-lg">
                <i data-lucide="share-2" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 overflow-y-auto pb-36 px-4 py-6 max-w-5xl mx-auto w-full space-y-8">

        <!-- SECTION: Descargador de Audio -->
        <section class="bg-theme-card border border-theme-border backdrop-blur-md rounded-2xl p-5 shadow-rose-glow">
            <h2 class="text-lg font-semibold text-theme-main mb-3 flex items-center gap-2">
                <i data-lucide="download" class="w-5 h-5 text-theme-primary"></i> Descargar Audio (YouTube / TikTok)
            </h2>
            <form id="download-form" class="space-y-4">
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <i data-lucide="link" class="absolute left-3.5 top-3.5 w-5 h-5 text-theme-muted/60"></i>
                        <input type="url" id="media-url" required placeholder="Pega el enlace de YouTube o TikTok aquí..." 
                            class="w-full bg-theme-dark/70 border border-theme-border rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-theme-primary focus:ring-1 focus:ring-theme-primary transition-all text-theme-main placeholder-theme-muted/50">
                    </div>
                    <select id="media-quality" class="bg-theme-dark/70 border border-theme-border rounded-xl px-4 py-3 text-sm text-theme-muted focus:outline-none focus:border-theme-primary">
                        <option value="320">320 kbps (Alta)</option>
                        <option value="192" selected>192 kbps (Media)</option>
                        <option value="128">128 kbps (Baja)</option>
                    </select>
                    <button type="submit" id="btn-download" class="bg-gradient-to-r from-theme-primary to-theme-hover hover:brightness-110 text-white font-medium px-6 py-3 rounded-xl flex items-center justify-center gap-2 transition-all shadow-rose-glow active:scale-95">
                        <i data-lucide="download-cloud" class="w-5 h-5"></i> Descargar MP3
                    </button>
                </div>
            </form>

            <!-- Barra de Progreso de Descarga -->
            <div id="download-progress" class="hidden mt-4 space-y-2">
                <div class="flex justify-between text-xs text-theme-muted">
                    <span id="download-status">Procesando audio...</span>
                    <span id="download-percentage">0%</span>
                </div>
                <div class="w-full bg-theme-dark h-2 rounded-full overflow-hidden border border-theme-border">
                    <div id="download-bar" class="bg-theme-primary h-full w-0 transition-all duration-300"></div>
                </div>
            </div>
        </section>

        <!-- SECTION: Buscador y Filtros de Biblioteca -->
        <section class="space-y-4">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                <!-- Buscador -->
                <div class="relative w-full md:w-72">
                    <i data-lucide="search" class="absolute left-3.5 top-3 w-4 h-4 text-theme-muted/60"></i>
                    <input type="text" id="search-input" placeholder="Buscar canción, artista..." 
                        class="w-full bg-theme-card border border-theme-border rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-theme-primary text-theme-main placeholder-theme-muted/50">
                </div>

                <!-- Controles de Ordenación -->
                <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                    <label class="text-xs text-theme-muted">Ordenar por:</label>
                    <select id="sort-by" class="bg-theme-card border border-theme-border rounded-lg px-3 py-2 text-xs text-theme-muted focus:outline-none focus:border-theme-primary">
                        <option value="title">Título</option>
                        <option value="artist">Artista</option>
                        <option value="duration">Duración</option>
                        <option value="date" selected>Fecha de descarga</option>
                    </select>
                    <button id="btn-sort-order" class="p-2 bg-theme-card border border-theme-border rounded-lg text-theme-muted hover:text-white hover:border-theme-primary transition-colors">
                        <i data-lucide="arrow-down-up" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Tabs de Navegación de Biblioteca -->
            <div class="flex border-b border-theme-border gap-6 text-sm font-medium">
                <button class="tab-btn border-b-2 border-theme-primary text-theme-primary pb-3 font-semibold" data-tab="songs">Canciones</button>
                <button class="tab-btn border-b-2 border-transparent text-theme-muted hover:text-theme-main pb-3 transition-colors" data-tab="playlists">Listas de reproducción</button>
                <button class="tab-btn border-b-2 border-transparent text-theme-muted hover:text-theme-main pb-3 transition-colors" data-tab="albums">Álbumes</button>
                <button class="tab-btn border-b-2 border-transparent text-theme-muted hover:text-theme-main pb-3 transition-colors" data-tab="artists">Artistas</button>
            </div>
        </section>

        <!-- SECTION: Lista de Canciones / Vista Principal -->
        <section id="view-container">
            <!-- Renderizado dinámico desde ui.js -->
            <div id="songs-list" class="space-y-2">
                <!-- Items de canción agregados dinámicamente -->
            </div>
        </section>
    </main>

    <!-- FOOTER PLAYER: Reproductor Fijo Inferior -->
    <footer class="fixed bottom-0 left-0 right-0 bg-theme-bg/95 border-t border-theme-border backdrop-blur-xl p-3 z-50">
        <div class="max-w-5xl mx-auto flex flex-col gap-2">
            <!-- Barra de Progreso de Canción -->
            <div class="flex items-center gap-3 text-xs text-theme-muted">
                <span id="current-time">0:00</span>
                <input type="range" id="seek-bar" value="0" min="0" max="100" class="w-full h-1.5 bg-theme-dark rounded-lg appearance-none cursor-pointer accent-theme-primary">
                <span id="total-duration">0:00</span>
            </div>

            <div class="flex items-center justify-between gap-4">
                <!-- Info de la pista actual -->
                <div class="flex items-center gap-3 w-1/3 min-w-0">
                    <img id="player-cover" 
                         src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50' viewBox='0 0 24 24' fill='none' stroke='%23e11d48' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='100%' height='100%' fill='%232b0008'/><path d='M9 18V5l12-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='18' cy='16' r='3'/></svg>" 
                         alt="Cover" 
                         class="w-12 h-12 rounded-lg object-cover bg-theme-card border border-theme-border">
                    <div class="min-w-0">
                        <h4 id="player-title" class="text-sm font-semibold text-theme-main truncate">Sin reproducción</h4>
                        <p id="player-artist" class="text-xs text-theme-muted truncate">Desconocido</p>
                    </div>
                </div>

                <!-- Controles centrales -->
                <div class="flex items-center gap-4">
                    <button id="btn-shuffle" class="text-theme-muted hover:text-white transition-colors">
                        <i data-lucide="shuffle" class="w-5 h-5"></i>
                    </button>
                    <button id="btn-prev" class="text-theme-muted hover:text-white transition-colors">
                        <i data-lucide="skip-back" class="w-5 h-5"></i>
                    </button>
                    <button id="btn-play-pause" class="w-10 h-10 rounded-full bg-theme-primary text-white flex items-center justify-center font-bold hover:scale-105 hover:bg-theme-hover transition-all shadow-rose-glow">
                        <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                    </button>
                    <button id="btn-next" class="text-theme-muted hover:text-white transition-colors">
                        <i data-lucide="skip-forward" class="w-5 h-5"></i>
                    </button>
                    <button id="btn-repeat" class="text-theme-muted hover:text-white transition-colors">
                        <i data-lucide="repeat" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Opciones adicionales (Velocidad, Temporizador, Favorito) -->
                <div class="flex items-center gap-3 w-1/3 justify-end">
                    <button id="btn-speed" class="text-xs font-semibold px-2 py-1 rounded bg-theme-card border border-theme-border text-theme-muted hover:text-theme-primary hover:border-theme-primary transition-all">1.0x</button>
                    <button id="btn-timer" class="text-theme-muted hover:text-theme-primary transition-colors"><i data-lucide="clock" class="w-5 h-5"></i></button>
                    <button id="btn-favorite" class="text-theme-muted hover:text-theme-primary transition-colors"><i data-lucide="heart" class="w-5 h-5"></i></button>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts del Proyecto -->
    <script src="assets/js/db.js"></script>
    <script src="assets/js/player.js"></script>
    <script src="assets/js/playlists.js"></script>
    <script src="assets/js/downloader.js"></script>
    <script src="assets/js/timer.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
